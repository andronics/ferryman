# Leases carry key credentials over plain HTTP: only the agents and
# Traefik may reach the coordinator. Adjust the traefik namespace's name
# if yours differs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferryman-coordinator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ferryman
      app.kubernetes.io/component: coordinator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ferryman
              app.kubernetes.io/component: agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 8470, protocol: TCP}
