# Pool rotation state and probes. Small; the default StorageClass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ferryman-controller-state
  labels:
    app.kubernetes.io/name: ferryman
    app.kubernetes.io/component: controller
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
