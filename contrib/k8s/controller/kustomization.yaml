apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
# controller.yaml becomes a Secret (it holds the agents' token hashes);
# the hash suffix restarts the controller when it changes.
secretGenerator:
  - name: ferryman-controller-config
    files:
      - controller.yaml
