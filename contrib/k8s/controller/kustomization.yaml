apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
# controller.yaml becomes a Secret (it holds the agents' token hashes).
# No hash suffix: the Secret is updated in place, the kubelet refreshes the
# mounted file, and the controller reloads it without a restart.
secretGenerator:
  - name: ferryman-controller-config
    options:
      disableNameSuffixHash: true
    files:
      - controller.yaml
