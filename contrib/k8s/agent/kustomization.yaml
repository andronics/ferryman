apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - daemonset.yaml
# config.yaml becomes the ferryman-config Secret; the hash suffix in its
# name rolls the DaemonSet when the config changes (the agent reads it once).
secretGenerator:
  - name: ferryman-config
    files:
      - config.yaml
