# ferryman agent config for the DaemonSet: one config for every node.
# Every setting and its default: contrib/config.example.yaml.
#
# {hostname} is the node's name (FERRYMAN_HOSTNAME, from the downward API).

# Probes and metrics on the pod's network: /readyz is the readiness probe.
api:
  listen:
    host: 0.0.0.0
    port: 8470

# Keys are leased from the controller: none are stored in the cluster's
# nodes. Each pod's token is its node's, copied in by the init container.
controller:
  url: http://ferryman-controller:8470
  token_file: /run/secrets/ferryman/token

pools:
  uploads:
    controller: true

# Pods have no MTA: send alerts to a webhook.
# notify:
#   webhook:
#     url: https://hooks.example.org/ferryman

defaults:
  uid: 1000                       # who owns the files in the mounts: the apps' uid
  gid: 1000

units:
  # Mount paths live under /var/lib/drive, the DaemonSet's Bidirectional
  # hostPath, so they show on the node and in consumer pods. Not under
  # /var/lib/ferryman (paths.state): verify refuses that.
  media-tv:
    drive_id: 0AAAAAAAAAAAAAAAAAA
    pool: uploads
    mounts:
      - path: /var/lib/drive/media-tv

# Transfers read from paths inside the pod: add a hostPath volume for each
# source to daemonset.yaml, at the same path.
transfers: {}
