[project]
name = "ferryman"
version = "0.1.0"
description = "Google Drive mounts, uploads and service-account key rotation via rclone"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "croniter>=6.2",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "starlette>=1.9",
    "typer>=0.27",
    "uvicorn>=0.54",
]

[project.scripts]
ferryman = "ferryman.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "types-pyyaml",
    "types-croniter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Explicit timeouts are deliberate: probes of a possibly-wedged FUSE path
# must kill their subprocess, which asyncio.timeout around a caller cannot.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Polling a condition with a deadline is what the tests want.
"tests/*" = ["ASYNC110"]

[tool.mypy]
strict = true
files = ["src/ferryman"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs rclone and FUSE on the host"]
